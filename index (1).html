<title>Mirror Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style id="ms-style">
/* Layout: a tinted hero band (headline + large photo), a three-step strip, a sticky filter bar, a card grid, then suggest/review panels. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --ink:#1f2340; --muted:#5b6078; --line:#dfe2ec;
  --band:#e9ebf8; --panel:#d9ddf3; --wood:#c98f5a; --wood-dark:#a8713f;
  --accent:#3b3f9e; --accent-ink:#ffffff; --sun:#f2b632; --sun-soft:#fdf0cf; --sun-ink:#6b4a00;
  --leaf:#e3f1ea; --leaf-ink:#1d5b3c; --chip:#eceef6; --photo:#ffffff; --danger:#b3261e; --shade:rgba(20,22,42,.45);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14162a; --surface:#1d2038; --ink:#eef0fb; --muted:#a6abc6; --line:#30345a;
  --band:#1a1d36; --panel:#262a4c; --wood:#9c6a3c; --wood-dark:#7a502b;
  --accent:#9ea4ff; --accent-ink:#14162a; --sun:#f2b632; --sun-soft:#3b3214; --sun-ink:#f7d47a;
  --leaf:#183528; --leaf-ink:#9fdcbb; --chip:#272b4a; --photo:#f4f4f7; --danger:#ff8a80; --shade:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14162a; --surface:#1d2038; --ink:#eef0fb; --muted:#a6abc6; --line:#30345a;
  --band:#1a1d36; --panel:#262a4c; --wood:#9c6a3c; --wood-dark:#7a502b;
  --accent:#9ea4ff; --accent-ink:#14162a; --sun:#f2b632; --sun-soft:#3b3214; --sun-ink:#f7d47a;
  --leaf:#183528; --leaf-ink:#9fdcbb; --chip:#272b4a; --photo:#f4f4f7; --danger:#ff8a80; --shade:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Hero */
.hero{background:var(--band)}
.hero .wrap{padding-block:40px 44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:center}
.hero-text{display:grid;gap:16px;min-width:0}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,5.6vw,4.4rem);line-height:.98;margin:0;letter-spacing:-.025em;text-wrap:balance}
h1 span{background:linear-gradient(transparent 60%, var(--sun) 60%, var(--sun) 90%, transparent 90%);padding-inline:2px}
.lede{max-width:52ch;margin:0;font-size:1.12rem;color:var(--muted)}
.lede strong{color:var(--ink)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;text-decoration:none;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default}
.art{position:relative;margin:0;min-width:0}
.art .frame{border-radius:22px;overflow:hidden;background:var(--panel);aspect-ratio:4/3;max-width:100%;box-shadow:0 18px 40px -24px var(--shade)}
.art img,.art svg{display:block;width:100%;height:100%;object-fit:cover}
.art figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.hero-admin{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.hero-admin input[type=text]{flex:1 1 200px;min-width:0;font:inherit;font-size:14px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

/* Steps */
.steps .wrap{padding-block:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.step b{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.step h2{font-size:1rem;margin:0 0 2px;font-family:var(--body)}
.step p{margin:0;color:var(--muted);font-size:15px}

/* Filter bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-block:1px solid var(--line)}
.bar .wrap{padding-block:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:15px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:15px;border:0;border-radius:999px;padding:7px 14px;background:var(--chip);color:var(--ink);display:flex;gap:6px;align-items:baseline}
.chip .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}

/* Grid */
main .wrap{padding-block:24px 40px}
.listhead{display:grid;gap:8px;margin:0 0 18px}
.count{color:var(--ink);margin:0;font-size:15px;font-weight:700}
.legend{margin:0;color:var(--muted);font-size:14px;line-height:1.9}
.legend .tag{font-size:12px;padding:2px 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.thumb{position:relative;margin:-18px -18px 4px;aspect-ratio:4/3;max-width:none;background:var(--photo);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.thumb.ph{background:var(--band)}
.thumb.ph svg{width:56px;height:56px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.thumb .photo-btn{position:absolute;right:10px;bottom:10px}
.thumb .credit{position:absolute;left:8px;bottom:8px;max-width:60%;font-size:11px;line-height:1.3;padding:2px 7px;border-radius:5px;background:var(--surface);color:var(--muted);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-row .src{font-size:13px;color:var(--muted)}
.ph-row .src.warn{color:var(--sun-ink);background:var(--sun-soft);padding:1px 6px;border-radius:5px}
.photos{border-color:var(--accent);border-width:2px}
.meter{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;max-width:420px}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--band)}
.ph-list{display:grid;gap:8px;max-height:520px;overflow:auto;padding-right:4px}
.ph-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ph-row .nm{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.ph-row code{font-size:13px;background:var(--chip);padding:2px 6px;border-radius:5px}
.ph-row a{color:var(--accent);font-weight:700}
.cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h3{font-family:var(--display);font-weight:500;font-size:1.25rem;line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.maker{margin:0;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.maker b{color:var(--ink);font-weight:700}
.note{margin:0;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:3px 9px;border-radius:6px;background:var(--chip);color:var(--ink)}
.tag.own{background:var(--leaf);color:var(--leaf-ink);font-weight:700}
.tag.price{background:var(--sun-soft);color:var(--sun-ink);font-variant-numeric:tabular-nums;font-weight:700}
.go{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.go a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:9px 14px;border-radius:9px;font-size:15px}
.go a.search-link{background:transparent;color:var(--accent);border:1.5px dashed var(--line)}
.go a.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.tag.ca{background:var(--panel);color:var(--ink);font-weight:700}
.tag.pick{background:var(--sun);color:#1f2340;font-weight:700}
.adm .btn.on{border-color:var(--sun);background:var(--sun-soft);color:var(--sun-ink)}
.adm{flex-wrap:wrap}
.go a:hover{filter:brightness(1.08)}
.adm{display:flex;gap:6px;margin-left:auto}
.empty{padding:40px 0;color:var(--muted)}
.linkbtn{color:var(--accent);background:none;border:0;text-decoration:underline;padding:0}

/* Suggest + review */
.panel .wrap{padding-block:8px 40px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px}
.box h2{font-family:var(--display);font-size:1.6rem;margin:0;font-weight:700;letter-spacing:-.01em}
.box p{margin:0;color:var(--muted);max-width:62ch}
.review{border-color:var(--sun);border-width:2px}
.outside{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.outside h3{margin:0;font-size:1.05rem}
.em{user-select:all;overflow-wrap:anywhere}
.sug-list{display:grid;gap:10px}
.sug{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.sug > div{min-width:0;flex:1 1 280px}
.sug h3{margin:0 0 2px;font-size:1.05rem;overflow-wrap:anywhere}
.sug p{font-size:14px;overflow-wrap:anywhere}
.sug .acts{display:flex;gap:8px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--sun-ink)}

/* Dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(560px, calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 60px -20px var(--shade)}
dialog::backdrop{background:var(--shade)}
dialog form{padding:22px;display:grid;gap:14px;max-height:85vh;overflow:auto}
dialog h2{font-family:var(--display);margin:0;font-size:1.4rem}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:14px}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{font:inherit;font-size:15px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--danger);font-size:14px;margin:0}

/* Publish bar + toast */
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom, 0px)}
.pubbar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pubbar .btn{background:var(--sun);color:#1f2340}
.pubbar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100vw - 32px)}

footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:32px 96px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
footer h2{font-family:var(--display);font-size:1.1rem;margin:0 0 6px;font-weight:700}
footer p{margin:0;color:var(--muted);max-width:60ch;font-size:15px}

@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;gap:28px;padding-block:28px 32px}
  .steps .wrap{grid-template-columns:1fr;gap:14px}
}
@media (max-width:480px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function doll(x, y, skin, hair, outfit, hairColor){
  var s = "", hy = y - 92;
  if (hair === "afro") s += '<circle cx="'+x+'" cy="'+(hy-4)+'" r="38" fill="'+hairColor+'"/>';
  if (hair === "puffs") s += '<circle cx="'+(x-26)+'" cy="'+(hy-22)+'" r="15" fill="'+hairColor+'"/><circle cx="'+(x+26)+'" cy="'+(hy-22)+'" r="15" fill="'+hairColor+'"/>';
  if (hair === "hijab") s += '<circle cx="'+x+'" cy="'+(hy+2)+'" r="35" fill="'+hairColor+'"/><rect x="'+(x-30)+'" y="'+(hy+10)+'" width="60" height="34" rx="14" fill="'+hairColor+'"/>';
  if (hair === "braids") s += '<rect x="'+(x-34)+'" y="'+(hy-6)+'" width="11" height="62" rx="5" fill="'+hairColor+'"/><rect x="'+(x+23)+'" y="'+(hy-6)+'" width="11" height="62" rx="5" fill="'+hairColor+'"/>';
  if (hair === "fringe") s += '<rect x="'+(x-34)+'" y="'+(hy-10)+'" width="68" height="42" rx="10" fill="'+hairColor+'"/><circle cx="'+(x+24)+'" cy="'+(hy-26)+'" r="7" fill="#e0607e"/>';
  s += '<rect x="'+(x-30)+'" y="'+(y-60)+'" width="60" height="60" rx="24" fill="'+outfit+'"/>';
  s += '<rect x="'+(x-30)+'" y="'+(y-22)+'" width="60" height="22" fill="'+outfit+'"/>';
  s += '<circle cx="'+x+'" cy="'+hy+'" r="'+(hair==="hijab"?25:29)+'" fill="'+skin+'"/>';
  if (hair === "bob") s += '<path d="M'+(x-31)+' '+(hy+6)+' A31 31 0 0 1 '+(x+31)+' '+(hy+6)+' L'+(x+31)+' '+(hy-4)+' Q'+x+' '+(hy-18)+' '+(x-31)+' '+(hy-4)+' Z" fill="'+hairColor+'"/>';
  if (hair === "fringe") s += '<path d="M'+(x-31)+' '+(hy-5)+' A31 31 0 0 1 '+(x+31)+' '+(hy-5)+' Z" fill="'+hairColor+'"/>';
  if (hair === "short") s += '<path d="M'+(x-29)+' '+(hy-2)+' A29 29 0 0 1 '+(x+29)+' '+(hy-2)+' Q'+x+' '+(hy-14)+' '+(x-29)+' '+(hy-2)+' Z" fill="'+hairColor+'"/>';
  if (hair === "braids" || hair === "puffs") s += '<path d="M'+(x-29)+' '+(hy-4)+' A29 29 0 0 1 '+(x+29)+' '+(hy-4)+' Q'+x+' '+(hy-16)+' '+(x-29)+' '+(hy-4)+' Z" fill="'+hairColor+'"/>';
  s += '<circle cx="'+(x-9)+'" cy="'+(hy+2)+'" r="3" fill="#1f2340"/><circle cx="'+(x+9)+'" cy="'+(hy+2)+'" r="3" fill="#1f2340"/>';
  s += '<path d="M'+(x-8)+' '+(hy+12)+' Q'+x+' '+(hy+19)+' '+(x+8)+' '+(hy+12)+'" stroke="#1f2340" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  s += '<circle cx="'+(x-16)+'" cy="'+(hy+11)+'" r="4" fill="#e8798a" opacity=".45"/><circle cx="'+(x+16)+'" cy="'+(hy+11)+'" r="4" fill="#e8798a" opacity=".45"/>';
  return s;
}
function block(x, y, size, color, letter){
  return '<rect x="'+x+'" y="'+(y-size)+'" width="'+size+'" height="'+size+'" rx="6" fill="'+color+'"/>' +

}

  s += doll(280, 200, "#c68642", "hijab", "#2f8f6b", "#7b4fa8");

function shrink(file){
  return new Promise(function(resolve){
    if (!window.createImageBitmap || /svg|gif/.test(file.type)) return resolve(file);
    createImageBitmap(file).then(function(bmp){
      var max = 720, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      var cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
      var cx = cv.getContext("2d"); cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
      cv.toBlob(function(b){ resolve(b && b.size < file.size ? b : file); }, "image/jpeg", 0.86);
    }).catch(function(){ resolve(file); });
  });
}

    var blob = await shrink(file);
    var r = await S.assets.upload(blob, { type: blob.type || file.type });
    items = items.map(function(i){ return i.id === id ? Object.assign({}, i, { img: r.id, pc: i.pc || i.m || i.via || hostOf(i.src) || "" }) : i; });
    S.dirty = true; return true;
  } catch (e) { toast(e && e.code === "store_unavailable" ? "Upload didn’t go through. Try again." : "“" + file.name + "” couldn’t be uploaded. Try a JPG or PNG."); return false; }
}
async function bulkUpload(files){
  var ids = {}; items.forEach(function(i){ ids[i.id.toLowerCase()] = i.id; });
  var done = 0, skipped = [];
  toast("Uploading " + files.length + " photo" + (files.length === 1 ? "" : "s") + "…");
  for (var k = 0; k < files.length; k++) {
    var m = files[k].name.toLowerCase().match(/^(f[a-z0-9]+?)(?:[^a-z0-9].*)?\.[a-z0-9]+$/);
    var id = m && ids[m[1]];
    if (!id) { skipped.push(files[k].name); continue; }
    if (await uploadFor(id, files[k])) done++;
  }
  renderAll();
  toast(done + " photo" + (done === 1 ? "" : "s") + " added" + (skipped.length ? ". Skipped " + skipped.length + " without a card code in the name (" + skipped.slice(0, 3).join(", ") + (skipped.length > 3 ? "…" : "") + ")" : "") + ". Publish when you’re ready.");
}
var photoTarget = null;

/* ---------- Form ---------- */
var formMode = null, formRef = null;
function fill(o){
  o = o || {};
  $("f-n").value = o.n || ""; $("f-m").value = o.m || ""; $("f-via").value = o.via || ""; $("f-u").value = o.u || "";
  $("f-c").value = o.c || (S.cat !== "all" ? S.cat : "dolls"); $("f-own").value = o.own || "";
  $("f-r").value = (o.r || []).join(", "); $("f-p").value = o.p || ""; $("f-loc").value = o.loc || ""; $("f-x").value = o.x || ""; $("f-cau").value = (o.ca && o.ca.u) || ""; $("f-cas").value = (o.ca && o.ca.s) || ""; $("f-pc").value = o.pc || ""; $("f-pc-wrap").hidden = !o.img;
}
function readForm(){
  function v(id){ return $(id).value.trim(); }
  var o = { c: v("f-c"), n: v("f-n") };
  ["m","via","p","loc","x"].forEach(function(k){ var val = v("f-"+k); if (val) o[k] = val; });
  var u = safeUrl(v("f-u")); if (u) o.u = u;
  var own = v("f-own"); if (own) o.own = own;
  var r = v("f-r").split(",").map(function(s){ return s.trim(); }).filter(Boolean).slice(0, 8); if (r.length) o.r = r;
  if (v("f-pc")) o.pc = v("f-pc");
  var cau = safeUrl(v("f-cau")); if (cau) { o.ca = { u: cau }; if (v("f-cas")) o.ca.s = v("f-cas"); if (formRef && formRef.ca && formRef.ca.own) o.ca.own = formRef.ca.own; }
  return o;
}
function openForm(mode, ref){
  formMode = mode; formRef = ref || null;
  var titles = {suggest:"Suggest a find", add:"Add to the list", edit:"Edit this find", approve:"Approve suggestion"};
  var oks = {suggest:"Send suggestion", add:"Add to list", edit:"Save changes", approve:"Approve and add"};
  $("frm-title").textContent = titles[mode]; $("frm-ok").textContent = oks[mode]; $("frm-err").hidden = true; $("frm-ok").disabled = false;
  fill(mode === "edit" || mode === "approve" ? ref : null);
  var d = $("dlg"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  $("f-n").focus();
}
function closeForm(){ var d = $("dlg"); if (d.close) d.close(); else d.removeAttribute("open"); }
function formError(msg){ var e = $("frm-err"); e.textContent = msg; e.hidden = false; }
function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function onSubmit(ev){
  ev.preventDefault();
  var o = readForm();
  if (!o.n) { formError("Add a name so people know what the find is."); return; }
  if ($("f-u").value.trim() && !o.u) { formError("That link doesn’t look like a web address. It should start with https://"); return; }
  if (formMode === "suggest") {
    $("frm-ok").disabled = true;
    try {
      o.sid = newId("s"); o.at = Date.now();
      var mine = S.mine.map(function(s){ return Object.assign({}, s); });
      mine.push(o);
      await S.db.doc("suggestions/" + S.uid).set({ items: mine.slice(-50) });
      closeForm(); toast("Thanks! Your suggestion was sent for review.");
    } catch (e) {
      $("frm-ok").disabled = false;
      if (e && e.code === "invalid_argument") { S.canSuggest = false; closeForm(); renderSuggest(); toast("You don’t have permission to suggest finds on this page."); }
      else formError("Your suggestion didn’t send. Check your connection and try again.");
    }
    return;
  }
  if (formMode === "add") { o.id = newId("f"); items.push(o); toast("Added. Publish to show it to everyone."); }
  if (formMode === "edit") { o.id = formRef.id; ["sid","img","src","fav"].forEach(function(k){ if (formRef[k]) o[k] = formRef[k]; }); items = items.map(function(i){ return i.id === o.id ? o : i; }); toast("Saved. Publish to show the change to everyone."); }
  if (formMode === "approve") { o.id = newId("f"); o.sid = formRef.sid; items.push(o); toast("Approved. Publish to add it for everyone."); }
  S.dirty = true; closeForm(); renderAll();
}

/* ---------- Owner actions ---------- */
async function writeSugDoc(uid, list){
  var ref = S.db.doc("suggestions/" + uid);
  if (list.length) await ref.set({ items: list }); else await ref.delete();
}
async function rejectSug(sid){
  var s = S.sugs.filter(function(x){ return x.sid === sid; })[0]; if (!s) return;
  var rest = S.sugs.filter(function(x){ return x.uid === s.uid && x.sid !== sid; }).map(strip);
  try { await writeSugDoc(s.uid, rest); toast("Suggestion rejected."); }
  catch (e) { toast("That didn’t save. Try again in a moment."); }
}
function strip(s){ var o = Object.assign({}, s); delete o.uid; return o; }
async function cleanupApproved(){
  if (S.cleaned || !S.admin) return; S.cleaned = true;
  var done = approvedSids(), byUid = {};
  S.sugs.forEach(function(s){ (byUid[s.uid] = byUid[s.uid] || []).push(s); });
  for (var uid in byUid) {
    var all = byUid[uid], keep = all.filter(function(s){ return !done[s.sid]; });
    if (keep.length !== all.length) { try { await writeSugDoc(uid, keep.map(strip)); } catch (e) {} }
  }
}
var SKELETON_CSS = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
var HEAD = '<title>Mirror Shelf</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">\n';
function buildHtml(){
  sortItems();
  var json = JSON.stringify({ hero: hero, cfg: cfg, items: items }).replace(/</g, "\\u003c");
  return '<!doctype html><html lang="en"><head><meta charset=utf8><meta name="description" content="Toys, books and care products that reflect many races, cultures and families, curated for transracial and multicultural families."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + SKELETON_CSS + '</style></head><body>' +
    HEAD + '<style id="ms-style">' + $("ms-style").textContent + '</style>\n<div id="app"></div>\n<script id="ms-data" type="application/json">' + json + '<\/script>\n<script id="ms-app">' + $("ms-app").textContent + '<\/script>\n</body></html>';
}
async function publishNow(){
  if (!S.art) { toast("Publishing isn’t available in this view. Open the page in Claude to publish."); return; }
  var b = $("pub-go"); b.disabled = true; b.textContent = "Publishing…";
  try { await S.art.publish(buildHtml()); }
  catch (e) {
    b.disabled = false; b.textContent = "Publish changes";
    var c = e && e.code;
    if (c === "conflict") toast("Someone else published first. The page is reloading with their version.");
    else if (c === "not_writer" || c === "not_granted") { toast("You don’t have permission to publish this page."); }
    else if (c === "rate_limited") toast("Too many publishes in a row. Wait a minute and try again.");
    else toast("Publishing didn’t work. Try again in a moment.");
  }
}

/* ---------- Events ---------- */
$("chips").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if (!b) return;
  S.cat = b.dataset.k; try { localStorage.setItem("ms-cat", S.cat); } catch (er) {}
  chipsRender(); render();
});
$("q").addEventListener("input", render); $("own").addEventListener("change", render); $("cnd").addEventListener("change", render);
$("reset").addEventListener("click", function(){ $("q").value = ""; $("own").checked = false; $("cnd").checked = false; S.cat = "all"; chipsRender(); render(); });
$("frm").addEventListener("submit", onSubmit);
$("frm-cancel").addEventListener("click", closeForm);
$("grid").addEventListener("click", function(e){
  var b = e.target.closest("button[data-act]"); if (!b || !S.admin) return;
  var it = items.filter(function(i){ return i.id === b.dataset.id; })[0]; if (!it) return;
  if (b.dataset.act === "photo") { photoTarget = it.id; $("card-file").click(); return; }
  if (b.dataset.act === "fav") {
    var on = !it.fav;
    items = items.filter(function(i){ return i.id !== it.id; });
    var upd = Object.assign({}, it); if (on) upd.fav = true; else delete upd.fav;
    if (on) { var lastFav = -1; items.forEach(function(i, k){ if (i.fav) lastFav = k; }); items.splice(lastFav + 1, 0, upd); } else items.push(upd);
    S.dirty = true; renderAll(); toast(on ? "Marked as a top pick. Publish to show it to everyone." : "Removed from top picks."); return;
  }
  if (b.dataset.act === "up" || b.dataset.act === "down") {
    var k = lastList.indexOf(it), nb = lastList[k + (b.dataset.act === "up" ? -1 : 1)];
    if (!nb || !!nb.fav !== !!it.fav || (!it.fav && nb.c !== it.c)) { toast(b.dataset.act === "up" ? "Already at the top of its group." : "Already at the bottom of its group."); return; }
    var ia = items.indexOf(it), ib = items.indexOf(nb); items[ia] = nb; items[ib] = it;
    S.dirty = true; var y = b.getBoundingClientRect().top; renderAll();
    var nbtn = document.querySelector('#grid button[data-act="'+b.dataset.act+'"][data-id="'+it.id+'"]'); if (nbtn) { window.scrollBy(0, nbtn.getBoundingClientRect().top - y); nbtn.focus(); }
    return;
  }
  if (b.dataset.act === "edit") openForm("edit", it);
  if (b.dataset.act === "remove") {
    if (b.dataset.armed) { items = items.filter(function(i){ return i.id !== it.id; }); S.dirty = true; renderAll(); toast("Removed. Publish to update the page for everyone."); }
    else { b.dataset.armed = "1"; b.textContent = "Confirm remove"; setTimeout(function(){ if (b.isConnected) { delete b.dataset.armed; b.textContent = "Remove"; } }, 4000); }
  }
});
$("review").addEventListener("click", function(e){
  var b = e.target.closest("button[data-sug]"); if (!b) return;
  var s = S.sugs.filter(function(x){ return x.sid === b.dataset.sid; })[0]; if (!s) return;
  if (b.dataset.sug === "approve") openForm("approve", s);
  else if (b.dataset.armed) { b.disabled = true; rejectSug(s.sid); }
  else { b.dataset.armed = "1"; b.textContent = "Confirm reject"; setTimeout(function(){ if (b.isConnected && !b.disabled) { delete b.dataset.armed; b.textContent = "Reject"; } }, 4000); }
});
$("suggest-box").addEventListener("change", function(e){
  if (e.target.id === "cfg-form" || e.target.id === "cfg-email") {
    var v = e.target.value.trim();
    if (e.target.id === "cfg-form") { var u = safeUrl(v); if (v && !u) { toast("That link doesn’t look like a web address."); return; } cfg.form = u || undefined; }
    else { if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast("That email address doesn’t look right."); return; } cfg.email = v || undefined; }
    S.dirty = true; renderSuggest(); $("pubbar").hidden = false; toast("Saved. Publish to show it to visitors.");
  }
});
$("suggest-box").addEventListener("click", function(e){
  if (e.target.id === "copy-email") {
    var em = cfg.email || "";
    var fallback = function(){ var r = document.createRange(); r.selectNodeContents($("sug-email")); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Address selected. Copy it with your keyboard."); };
    try { navigator.clipboard.writeText(em).then(function(){ toast("Email address copied."); }, fallback); } catch (er) { fallback(); }
    return;
  }
  if (e.target.id === "open-suggest") openForm("suggest");
  if (e.target.id === "open-add") openForm("add");
});
$("hero-admin").addEventListener("click", function(e){
  if (e.target.id === "hero-up") $("hero-file").click();
  if (e.target.id === "hero-rm") { hero = null; S.dirty = true; renderAll(); toast("Photo removed. Publish to update the page."); }
});
$("hero-admin").addEventListener("change", function(e){
  if (e.target.id === "hero-alt" && hero) { hero = Object.assign({}, hero, { alt: e.target.value.trim() }); S.dirty = true; $("pubbar").hidden = false; var cap = $("hero-cap"); cap.textContent = hero.alt; cap.hidden = !hero.alt; }
});
$("hero-file").addEventListener("change", async function(e){
  var f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f || !S.assets) return;
  if (f.size > 20 * 1024 * 1024) { toast("That photo is over 20 MB. Choose a smaller one."); return; }
  toast("Uploading photo…");
  try { var r = await S.assets.upload(f); hero = { id: r.id, alt: (hero && hero.alt) || "" }; S.dirty = true; renderAll(); toast("Photo added. Add a short description, then publish."); }
  catch (er) { toast(er && er.code === "store_unavailable" ? "Upload didn’t go through. Try again." : "That file couldn’t be uploaded. Try a JPG or PNG photo."); }
});
$("photos").addEventListener("click", function(e){
  var t = e.target;
  if (t.id === "ph-toggle") { photosOpen = !photosOpen; renderPhotos(); return; }
  if (t.closest && t.closest("#drop")) { $("bulk-file").click(); return; }
  var b = t.closest && t.closest("button[data-act=photo]"); if (b) { photoTarget = b.dataset.id; $("card-file").click(); }
});
$("photos").addEventListener("keydown", function(e){ if (e.target.id === "drop" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("bulk-file").click(); } });
["dragenter","dragover"].forEach(function(ev){ $("photos").addEventListener(ev, function(e){ var d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } }); });
$("photos").addEventListener("dragleave", function(e){ var d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
$("photos").addEventListener("drop", function(e){ var d = e.target.closest && e.target.closest("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); var fs = Array.prototype.slice.call(e.dataTransfer.files || []); if (fs.length) bulkUpload(fs); else toast("Save the photo to your device first, then drop the file here."); });
$("bulk-file").addEventListener("change", function(e){ var fs = Array.prototype.slice.call(e.target.files || []); e.target.value = ""; if (fs.length) bulkUpload(fs); });
$("card-file").addEventListener("change", async function(e){
  var f = e.target.files && e.target.files[0]; e.target.value = ""; var id = photoTarget; photoTarget = null;
  if (!f || !id || !S.assets) return;
  toast("Uploading photo…");
  if (await uploadFor(id, f)) { renderAll(); toast("Photo added. Publish when you’re ready."); }
});
$("pub-go").addEventListener("click", publishNow);
$("pub-discard").addEventListener("click", function(){ items = DATA.items.slice(); hero = DATA.hero || null; cfg = Object.assign({}, DATA.cfg || {}); S.dirty = false; renderAll(); toast("Changes discarded."); });
window.addEventListener("beforeunload", function(e){ if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

renderAll();


})();
